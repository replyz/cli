# Publish @replyz/cli to npm when a GitHub release is published (copied to replyz/cli as
# .github/workflows/release.yml by the export script in the Replyz source tree).
# npm Trusted Publishing (OIDC): no npm token is stored in GitHub, and npm adds provenance itself.
# npm trusted publisher: owner=replyz, repo=cli, workflow=release.yml, environment=npm
#
# Dist-tag: a pre-release (GitHub "Set as a pre-release") publishes under `next`; a normal release
# publishes under `latest`. Until launch, only pre-releases.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@replyz/cli
    permissions:
      contents: read
      id-token: write # required for Trusted Publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@11

      # The release tag (e.g. v0.1.0) must match package.json and src/version.ts.
      - name: Check tag matches version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          test "${TAG#v}" = "$PKG" || { echo "Tag $TAG does not match package.json $PKG"; exit 1; }
          grep -q "VERSION = \"$PKG\"" src/version.ts || { echo "src/version.ts does not say $PKG"; exit 1; }

      - name: Build
        run: |
          npm ci
          npm run typecheck
          npm run build
          node dist/bin.js --version

      - name: Publish
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then TAG=next; else TAG=latest; fi
          npm publish --access public --tag "$TAG"
